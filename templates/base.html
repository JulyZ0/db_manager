{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}数据库实例管理系统{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      数据库实例管理
      <small>运维操作台</small>
    </div>
    <nav>
      <a href="{% url 'web:dashboard' %}"
         class="{% if active_nav == 'dashboard' %}active{% endif %}">总览</a>
      <a href="{% url 'web:department_list' %}"
         class="{% if active_nav == 'departments' %}active{% endif %}">部门管理</a>
      <a href="{% url 'web:cluster_list' %}"
         class="{% if active_nav == 'clusters' %}active{% endif %}">集群管理</a>
      <a href="{% url 'web:instance_list' %}"
         class="{% if active_nav == 'instances' %}active{% endif %}">实例管理</a>
      <a href="{% url 'web:stats' %}"
         class="{% if active_nav == 'stats' %}active{% endif %}">数量统计</a>
      <a href="{% url 'web:slow_requests' %}"
         class="{% if active_nav == 'slow' %}active{% endif %}">慢请求</a>
      <a href="{% url 'web:console' %}"
         class="{% if active_nav == 'console' %}active{% endif %}">控制台</a>
      <a href="/api/v1/docs" target="_blank">接口文档</a>
      <a href="/admin/" target="_blank">后台管理</a>
    </nav>
  </aside>

  <main class="main">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
